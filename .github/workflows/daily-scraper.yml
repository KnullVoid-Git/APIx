name: APIx Daily Automated Scraper & Index Engine

on:
  schedule:
    # 1. Runs daily at 18:30 UTC (00:00 IST / Midnight)
    - cron: '30 18 * * *'
    # 2. Runs daily at 00:00 UTC (05:30 AM IST / Morning Bulletin)
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      routes:
        description: 'Routes to scrape (comma-separated or "all")'
        required: false
        default: 'all'
      sources:
        description: 'Sources to scrape (comma-separated or "all")'
        required: false
        default: 'easemytrip,cleartrip,akasa'
      windows:
        description: 'Booking windows (comma-separated or "all")'
        required: false
        default: 'T+1,T+7,T+15,T+30,T+45'

concurrency:
  group: apix-daily-scraper
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape-and-index:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers & Dependencies
        run: npx playwright install --with-deps chromium

      - name: Execute Real Playwright Scraper across Basket
        run: |
          npm run scrape -- --routes all --sources easemytrip,cleartrip,akasa --windows T+1,T+7,T+15,T+30,T+45 --strict

      - name: Execute Data Cleaning & Outlier Detection ETL
        run: |
          npm run clean

      - name: Compute Official Laspeyres Index & Time Series
        run: |
          npm run compute-index

      - name: Commit and Push Updated Data Records
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "APIx PriceIndex Bot"
          
          # Add cleaned records, daily index rollups, and snapshots (excluding large runs/)
          git add data/snapshots/ data/cleaned/ data/index/
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No new data changes to commit."
          else
            git commit -m "chore(data): automated daily scrape & index computation [skip ci]"
            git push origin main
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post Execution Summary
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "### ✅ Daily Automated Scrape & Index Run Succeeded" >> $GITHUB_STEP_SUMMARY
            echo "Successfully updated live daily index time-series and pushed records to main." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Daily Automated Scrape & Index Run Failed" >> $GITHUB_STEP_SUMMARY
            echo "An error occurred during scraping, ETL cleaning, or git synchronization. Check job logs for details." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Send Failure Webhook Alert
        if: failure()
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -n "${{ secrets.DISCORD_WEBHOOK }}" ]; then
            curl -s -H "Content-Type: application/json" -X POST \
              -d "{\"content\": \"🚨 **APIx Scraper Pipeline Alert**: Daily automated run failed on commit \`${{ github.sha }}\`. [View Run Logs]($RUN_URL)\"}" \
              "${{ secrets.DISCORD_WEBHOOK }}" || true
          fi
          if [ -n "${{ secrets.SLACK_WEBHOOK }}" ]; then
            curl -s -H "Content-Type: application/json" -X POST \
              -d "{\"text\": \"🚨 *APIx Scraper Pipeline Alert*: Daily automated run failed on commit `${{ github.sha }}`. View Run Logs: $RUN_URL\"}" \
              "${{ secrets.SLACK_WEBHOOK }}" || true
          fi
